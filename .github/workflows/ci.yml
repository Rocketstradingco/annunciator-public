name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The job names "python (3.10)", "python (3.13)" and "web" are required
  # status checks on main; keep them unchanged.
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The server, tools and tests use only the standard library.
      - name: Tests
        run: python -m unittest discover -s tests -v
      # AUDIT_MARKERS is an optional repository secret: owner-specific words
      # (old host names, account names, addresses), one per line. Kept out of
      # the tree so the list of what to hide is never published.
      - name: Distribution audit
        env:
          AUDIT_MARKERS: ${{ secrets.AUDIT_MARKERS }}
        run: |
          if [ -n "$AUDIT_MARKERS" ]; then
            mkdir -p runtime && printf '%s\n' "$AUDIT_MARKERS" > runtime/audit-markers.txt
          fi
          python tools/audit_public.py
      - name: Example configurations validate
        run: python -m annunciator config validate config/minimal.example.jsonc config/full.example.jsonc
      - name: Generated schema, examples and guide are current
        run: python tools/build_docs.py --check
      - name: Server starts and answers
        run: |
          python -m annunciator serve --port 18161 --data-dir "$RUNNER_TEMP/annunciator" &
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18161/api/health && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:18161/api/state > /dev/null
          curl -fsS http://127.0.0.1:18161/ > /dev/null
          kill %1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ruff
        run: python -m pip install ruff==0.15.8
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format
        run: ruff format --check .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: JavaScript syntax
        run: for f in web/*.js; do node --check "$f"; done
      # Copies web/ into the Android project; no SDK is needed for this step.
      - name: Capacitor sync
        run: npx cap sync android
