name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Remove your own IP addresses, host names, user names and keys** from everything you paste.
        Security problems: please use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Output of `python3 -m annunciator doctor` (redacted).
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Server log lines
      description: The lines around the problem, e.g. from `python3 -m annunciator serve --log-level DEBUG` (redacted).
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `python3 -m annunciator version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Linux distribution, Python version, and Android version if relevant.
