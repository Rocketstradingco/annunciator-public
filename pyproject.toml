[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "annunciator"
# Keep in step with package.json, which the Android build and the server read.
version = "0.3.0"
description = "Self-hosted dashboard for computers and HTTP services, with an optional memory router for AI agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# The runtime is Python standard library only. Keep this list empty.
dependencies = []
classifiers = [
    "Environment :: Web Environment",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
dev = ["ruff==0.15.8", "pytest>=8"]

[project.scripts]
annunciator = "annunciator.cli:main"

[tool.setuptools.packages.find]
include = ["annunciator*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["android", "node_modules", "runtime", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "SIM105",  # try/except/pass reads better than contextlib.suppress in hot paths here
    "RUF001",  # typographic quotes in user-facing strings are intentional
    "RUF005",  # [*a, b] vs a + [b]: either reads fine
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Inline CSS and a stub script injected into preview pages are clearer on one line.
"tools/ui_preview.py" = ["E501"]
"tools/build_docs.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["annunciator", "support", "audit_public", "build_docs", "package_public"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
